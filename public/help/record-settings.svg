<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 326" role="img" aria-label="Play Your Line settings with the input set to BlackHole and the output set to headphones" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif"><rect width="720" height="326" rx="14" fill="#141a26"/><text x="360" y="30" text-anchor="middle" fill="#e8eef7" font-size="15" font-weight="600">Play Your Line › Settings › Audio</text><rect x="90" y="50" width="540" height="230" rx="12" fill="#1d2433" stroke="#33415a"/><text x="120" y="92" text-anchor="start" fill="#e8eef7" font-size="15" font-weight="600">Input</text><rect x="120" y="104" width="330" height="34" rx="7" fill="#27324a" stroke="#4cc3cd" stroke-width="2"/><text x="134" y="126" text-anchor="start" fill="#e8eef7" font-size="14" font-weight="600">BlackHole 2ch</text><text x="432" y="126" text-anchor="middle" fill="#9db0c7" font-size="14" font-weight="400">▾</text><text x="470" y="126" text-anchor="start" fill="#7fd89a" font-size="12.5" font-weight="400">← the cable, not the microphone</text><text x="120" y="172" text-anchor="start" fill="#e8eef7" font-size="15" font-weight="600">Output</text><rect x="120" y="184" width="330" height="34" rx="7" fill="#27324a" stroke="#4cc3cd" stroke-width="2"/><text x="134" y="206" text-anchor="start" fill="#e8eef7" font-size="14" font-weight="600">Headphones</text><text x="432" y="206" text-anchor="middle" fill="#9db0c7" font-size="14" font-weight="400">▾</text><text x="470" y="206" text-anchor="start" fill="#f0c36a" font-size="12.5" font-weight="400">← never the cable (no echo)</text><text x="120" y="256" text-anchor="start" fill="#9db0c7" font-size="12.5" font-weight="400">Then arm your channel and record: the DAW’s sound arrives as one channel (mono).</text><text x="360" y="306" text-anchor="middle" fill="#6f7f96" font-size="11.5" font-weight="400">Chrome or Edge works best. Illustration, not a screenshot.</text></svg>