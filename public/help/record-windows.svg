<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 364" role="img" aria-label="Windows: DAW to VB-Cable to Play Your Line, with Listen to this device for monitoring" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif"><rect width="720" height="364" rx="14" fill="#141a26"/><text x="360" y="30" text-anchor="middle" fill="#e8eef7" font-size="15" font-weight="600">Windows: hear the cable too (so you can play along)</text><rect x="24" y="64" width="200" height="70" rx="10" fill="#1c2535" stroke="#f0c36a" stroke-width="2"/><text x="124.0" y="93.0" text-anchor="middle" fill="#e8eef7" font-size="16" font-weight="600">DAW output</text><text x="124.0" y="115.0" text-anchor="middle" fill="#9db0c7" font-size="12.5">= CABLE Input (VB-Cable)</text><line x1="224" y1="99" x2="270.0" y2="99.0" stroke="#4cc3cd" stroke-width="2.5"/><polygon points="276,99 267.9,102.9 267.9,95.1" fill="#4cc3cd"/><rect x="276" y="64" width="200" height="70" rx="10" fill="#1c2535" stroke="#f0c36a" stroke-width="2"/><text x="376.0" y="93.0" text-anchor="middle" fill="#e8eef7" font-size="16" font-weight="600">CABLE Output</text><text x="376.0" y="115.0" text-anchor="middle" fill="#9db0c7" font-size="12.5">shows up as an input</text><line x1="476" y1="99" x2="522.0" y2="99.0" stroke="#4cc3cd" stroke-width="2.5"/><polygon points="528,99 519.9,102.9 519.9,95.1" fill="#4cc3cd"/><rect x="528" y="64" width="168" height="70" rx="10" fill="#1c2535" stroke="#4cc3cd" stroke-width="2"/><text x="612.0" y="93.0" text-anchor="middle" fill="#e8eef7" font-size="16" font-weight="600">Play Your Line</text><text x="612.0" y="115.0" text-anchor="middle" fill="#9db0c7" font-size="12.5">Input = CABLE Output</text><rect x="24" y="170" width="672" height="150" rx="10" fill="#1d2433" stroke="#33415a"/><text x="44" y="200" text-anchor="start" fill="#e8eef7" font-size="13.5" font-weight="600">To hear the DAW in your headphones as well:</text><text x="44" y="226" text-anchor="start" fill="#9db0c7" font-size="12.5" font-weight="400">1. Right-click the speaker icon › Sound settings › More sound settings › Recording tab.</text><text x="44" y="248" text-anchor="start" fill="#9db0c7" font-size="12.5" font-weight="400">2. Double-click CABLE Output › Listen tab › tick  “Listen to this device”.</text><text x="44" y="270" text-anchor="start" fill="#9db0c7" font-size="12.5" font-weight="400">3. Under “Playback through this device” choose your headphones › OK.</text><text x="44" y="300" text-anchor="start" fill="#f0c36a" font-size="12.5" font-weight="400">Keep Play Your Line’s own output on your headphones, not on the cable.</text><text x="360" y="344" text-anchor="middle" fill="#6f7f96" font-size="11.5" font-weight="400">Illustration, not a screenshot: names differ between Windows versions.</text></svg>