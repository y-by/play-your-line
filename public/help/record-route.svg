<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img" aria-label="Diagram: DAW to a virtual cable to Play Your Line, with the DAW also going to headphones" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif"><rect width="720" height="372" rx="14" fill="#141a26"/><text x="360" y="34" text-anchor="middle" fill="#e8eef7" font-size="16" font-weight="600">The route: the other app’s sound goes through a virtual cable into Play Your Line</text><rect x="24" y="80" width="190" height="84" rx="10" fill="#1c2535" stroke="#4cc3cd" stroke-width="2"/><text x="119.0" y="116.0" text-anchor="middle" fill="#e8eef7" font-size="16" font-weight="600">Your DAW or synth</text><text x="119.0" y="138.0" text-anchor="middle" fill="#9db0c7" font-size="12.5">Logic, Ableton, Reaper…</text><rect x="265" y="80" width="190" height="84" rx="10" fill="#1c2535" stroke="#f0c36a" stroke-width="2"/><text x="360.0" y="116.0" text-anchor="middle" fill="#e8eef7" font-size="16" font-weight="600">Virtual cable</text><text x="360.0" y="138.0" text-anchor="middle" fill="#9db0c7" font-size="12.5">BlackHole · VB-Cable</text><rect x="506" y="80" width="190" height="84" rx="10" fill="#1c2535" stroke="#4cc3cd" stroke-width="2"/><text x="601.0" y="116.0" text-anchor="middle" fill="#e8eef7" font-size="16" font-weight="600">Play Your Line</text><text x="601.0" y="138.0" text-anchor="middle" fill="#9db0c7" font-size="12.5">Settings › Input = the cable</text><line x1="214" y1="122" x2="259.0" y2="122.0" stroke="#4cc3cd" stroke-width="2.5"/><polygon points="265,122 256.9,125.9 256.9,118.1" fill="#4cc3cd"/><line x1="455" y1="122" x2="500.0" y2="122.0" stroke="#4cc3cd" stroke-width="2.5"/><polygon points="506,122 497.9,125.9 497.9,118.1" fill="#4cc3cd"/><rect x="265" y="230" width="190" height="70" rx="10" fill="#1c2535" stroke="#7fd89a" stroke-width="2"/><text x="360.0" y="259.0" text-anchor="middle" fill="#e8eef7" font-size="16" font-weight="600">Your headphones</text><text x="360.0" y="281.0" text-anchor="middle" fill="#9db0c7" font-size="12.5">so you still hear the DAW</text><line x1="119" y1="164" x2="119.0" y2="259.0" stroke="#7fd89a" stroke-width="2.5" stroke-dasharray="6 5"/><polygon points="119,265 115.1,256.9 122.9,256.9" fill="#7fd89a"/><line x1="119" y1="265" x2="258" y2="265" stroke="#7fd89a" stroke-width="2.5" stroke-dasharray="6 5"/><line x1="228" y1="265" x2="259.0" y2="265.0" stroke="#7fd89a" stroke-width="2.5" stroke-dasharray="6 5"/><polygon points="265,265 256.9,268.9 256.9,261.1" fill="#7fd89a"/><rect x="506" y="230" width="190" height="70" rx="10" fill="#1c2535" stroke="#7fd89a" stroke-width="2"/><text x="601.0" y="259.0" text-anchor="middle" fill="#e8eef7" font-size="16" font-weight="600">Play Your Line sound</text><text x="601.0" y="281.0" text-anchor="middle" fill="#9db0c7" font-size="12.5">Output = your headphones</text><line x1="601" y1="164" x2="601.0" y2="224.0" stroke="#7fd89a" stroke-width="2.5" stroke-dasharray="6 5"/><polygon points="601,230 597.1,221.9 604.9,221.9" fill="#7fd89a"/><text x="360" y="332" text-anchor="middle" fill="#f0c36a" font-size="12.5" font-weight="400">PLAY YOUR LINE’S OWN SOUND (the song) must NOT go into the cable, or it records itself.</text><text x="360" y="352" text-anchor="middle" fill="#6f7f96" font-size="11.5" font-weight="400">Illustration: the exact names depend on your computer.</text></svg>