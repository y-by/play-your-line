[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: send every path to index.html so deep links such as
# /song/<id> and /invite/<token> load instead of returning a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
